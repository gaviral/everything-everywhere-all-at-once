<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2A2O film stage</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090c}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:white}#scene{position:absolute;inset:0;perspective:2400px}#camera{position:absolute;inset:0;transform-style:preserve-3d}
.type{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:152px;font-weight:650;letter-spacing:-.065em;line-height:1.05;text-align:center;padding:100px}
.plane{position:absolute;left:50%;top:50%;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 65px 130px -25px #001c6680,0 20px 50px #001b5550;border:1.5px solid #ffffff9c}.plane video,.plane img{display:block;width:100%;height:auto}
.wall-tile{position:absolute;width:1920px;height:1920px;overflow:hidden;background:#0d1014;outline:1px solid #48515c}.wall-tile img,.wall-tile video{display:block;width:100%;height:100%;object-fit:contain}
#heading{position:absolute;left:70px;top:45px;font-size:44px;font-weight:600;letter-spacing:-.035em}
.signature{position:absolute;inset:0}.signature-icon{position:absolute;left:50%;top:44%;width:220px;height:220px;filter:drop-shadow(0 12px 18px #00143b25)}.signature-svg,.signature-photo{position:absolute;inset:0;width:100%;height:100%}.signature-photo{border-radius:48px}.signature-glint{position:absolute;left:64%;top:41%;width:16px;height:16px;border-radius:50%;background:white;filter:blur(2px);opacity:0}.signature-name{position:absolute;top:44%;font-size:164px;font-weight:700;line-height:1;letter-spacing:-.065em;white-space:nowrap;transform-origin:left center}.signature-tagline{position:absolute;top:calc(44% + 170px);width:100%;font-size:50px;font-weight:500;letter-spacing:-.035em;text-align:center}.signature-credits,.signature-disclosure{position:absolute;width:100%;text-align:center;font-size:22px;letter-spacing:0;line-height:1.2}.signature-credits{bottom:87px}.signature-disclosure{bottom:43px}
.computer{position:absolute;left:50%;top:50%;width:1280px;transform-style:preserve-3d;filter:drop-shadow(0 80px 60px #17273638)}.computer-lid{position:relative;border:18px solid #262a30;border-bottom-width:27px;border-radius:24px 24px 10px 10px;background:#15181d;box-shadow:inset 0 0 0 2px #69717a,0 2px 1px #b9c1c9}.computer-lid::before{content:"";position:absolute;width:6px;height:6px;background:#080a0e;border:1px solid #58616a;border-radius:50%;left:calc(50% - 3px);top:-12px}.computer-screen{position:relative;overflow:hidden;aspect-ratio:1920/1010;background:#f4f1e9}.computer-screen video{display:block;position:absolute;top:0;width:100%;height:auto}.computer-deck{position:relative;width:114%;height:42px;margin-left:-7%;background:linear-gradient(#d1d7de,#a5adb8 40%,#707a87);clip-path:polygon(6% 0,94% 0,100% 78%,99% 100%,1% 100%,0 78%);border-radius:0 0 30px 30px}.computer-trackpad{position:absolute;left:41%;top:0;width:18%;height:14px;background:#818b97;border-radius:0 0 12px 12px}.product-promise{position:absolute;top:0;padding:50px 0 28px;background:linear-gradient(#f2f4f5 0%,#f2f4f5 70%,#f2f4f500 100%);left:0;width:100%;text-align:center;color:#111c30;font-size:54px;font-weight:600;letter-spacing:-.04em}
</style>
<main id="stage" aria-label="Film frame"><div id="scene"><div id="camera"></div></div><div id="heading"></div></main>
<script type="module">
import {createWall,drawWall} from './wall.mjs';
import {createBrand,drawBrand} from './brand.mjs';
import {createLaptop,drawLaptop} from './laptop.mjs';
import {wordMotion} from './motion.mjs';
const stage=document.querySelector('#stage'),camera=document.querySelector('#camera'),heading=document.querySelector('#heading');
let active=null,videos=[],wallTiles=[],planes=[],brand=null,laptop=null;
const lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t),array=v=>Array.isArray(v)?v:[v];
const background=v=>v==='meta'?'radial-gradient(ellipse at 45% 30%,#2683ff,#0866ff 55%,#034ac2)':v==='muse'?'linear-gradient(125deg,#0866ff,#7659ed 60%,#ec91c5)':v;
const bounded=(promise,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error(label)),15000))]);
function textPlate(text){const n=document.createElement('div');n.className='type';n.textContent=text;camera.append(n);return n;}
function posePlane(plane,local){
 const {node,spec,x,y,z}=plane,from=spec.tilt??[8,-12,-3],to=spec.tiltTo??from,t=ease(Math.min(1,local/(spec.settleSeconds??.7)));
 const [rx,ry,rz]=from.map((v,i)=>lerp(v,to[i],t));
 node.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;return [rx,ry,rz];
}
async function createPlane(spec,count,i){
 const node=document.createElement('div');node.className='plane';
 const x=spec.position?.[0]??(count===1?0:(i-(count-1)/2)*530),y=spec.position?.[1]??(count===1?0:(i%2?-65:65));
 node.style.width=`${spec.width??(count===1?1380:900)}px`;const plane={node,spec,x,y,z:i*25};planes.push(plane);posePlane(plane,0);
 if(spec.fullFrame)Object.assign(node.style,{border:'0',borderRadius:'0',boxShadow:'none'});
 const media=document.createElement(spec.image?'img':'video');node.append(media);camera.append(node);
 if(spec.image){media.src=spec.source;await bounded(media.decode(),'Still image load timed out');}
 else{
  media.muted=true;media.playsInline=true;media.preload='auto';
  const ready=new Promise((yes,no)=>{media.addEventListener('loadeddata',yes,{once:true});media.addEventListener('error',()=>no(Error('Cannot decode clip')),{once:true});});
  media.src=spec.source;await bounded(ready,'Clip load timed out');videos.push({video:media,spec});
 }
 if(spec.crop){const [x,y,w,h]=spec.crop;node.style.aspectRatio=`${(media.videoWidth??media.naturalWidth)*w} / ${(media.videoHeight??media.naturalHeight)*h}`;Object.assign(media.style,{position:'absolute',width:`${100/w}%`,left:`${-100*x/w}%`,top:`${-100*y/h}%`});}
}
function baseColour(shot){if(shot.kind==='laptop')return '#f2f4f5';if(shot.kind==='brand'||shot.kind==='end')return shot.phase==='opening'?'#000':'#fff';if(shot.kind==='feature'||shot.kind==='card'||shot.kind==='list')return shot.colour??'#0866ff';if(shot.kind==='wall')return '#000';return '#000';}
async function mount(shot){
 videos.forEach(({video})=>{video.pause();video.removeAttribute('src');video.load();});videos=[];wallTiles=[];planes=[];brand=null;laptop=null;camera.replaceChildren();
 camera.style.opacity='1';camera.style.transformOrigin='50% 50%';stage.style.background=background(shot.background??baseColour(shot));
 stage.style.color=(shot.kind==='brand'||shot.kind==='end')&&shot.phase!=='opening'?'#08090c':'#fff';heading.textContent=shot.heading??'';
 if(['title','pulse','feature','card','list'].includes(shot.kind))textPlate('');
 if(shot.kind==='brand'||shot.kind==='end')brand=createBrand(shot,camera);
 const clips=shot.kind==='plane'?[shot]:shot.kind==='planes'?shot.clips:[];for(let i=0;i<clips.length;i++)await createPlane(clips[i],clips.length,i);
 if(shot.kind==='laptop')laptop=await createLaptop(shot,camera,videos,bounded);
 if(shot.kind==='wall')wallTiles=await createWall(shot,camera,videos,bounded);active=shot.index;
}
async function seek(video,target){
 if(target>=video.duration)throw Error(`Clip too short: needs ${target.toFixed(3)}s, has ${video.duration.toFixed(3)}s`);
 if(Math.abs(video.currentTime-target)<1e-7&&video.readyState>=2)return;
 await bounded(new Promise((yes,no)=>{const failed=()=>no(Error('Clip seek failed'));video.addEventListener('error',failed,{once:true});video.addEventListener('seeked',()=>{video.removeEventListener('error',failed);yes();},{once:true});video.currentTime=target;}),'Clip seek timed out');
}
window.filmFrame=async(shot,local,scale=1)=>{
 stage.style.transform=`scale(${scale})`;if(active!==shot.index)await mount(shot);
 const progress=Math.min(1,local/shot.duration),t=ease(progress),from=shot.drift?.from??[0,0],to=shot.drift?.to??[0,0],zoom=shot.zoom??[1,1];
 camera.style.transform=`translate(${lerp(from[0],to[0],t)}px,${lerp(from[1],to[1],t)}px) scale(${lerp(zoom[0],zoom[1],t)})`;
 let word=null;
 if(shot.kind==='title'){const words=array(shot.words);camera.firstChild.textContent=words[Math.min(words.length-1,Math.floor(progress*words.length))];}
 if(shot.kind==='pulse'){
  const time=local-(shot.delay??1.2),words=array(shot.words),index=Math.min(words.length-1,Math.max(0,Math.floor(time/(shot.beat??.7))));camera.firstChild.textContent=words[index];
  word=wordMotion(camera.firstChild,time-index*(shot.beat??.7));
 }
 if(shot.kind==='feature'){camera.firstChild.textContent=shot.word;word=wordMotion(camera.firstChild,local,{entrance:shot.entrance??.12,duration:shot.duration,shrink:shot.shrink});}
 if(shot.kind==='card')camera.firstChild.textContent=shot.word;
 if(shot.kind==='list')camera.firstChild.textContent=shot.names[Math.min(shot.names.length-1,Math.floor((local+1e-8)/shot.seconds))];
 const tilts=planes.map(p=>posePlane(p,local)),wall=shot.kind==='wall'?drawWall(shot,local,camera,wallTiles):null;
 const brandState=brand?drawBrand(brand,shot,local):null,laptopState=laptop?drawLaptop(laptop,shot,local):null;
 await Promise.all(videos.map(({video,spec})=>seek(video,(spec.start??0)+(spec.loop?local%(spec.loopSeconds??video.duration-(spec.start??0)):Math.min(local*(spec.rate??1),spec.playSeconds??local*(spec.rate??1))))));
 await document.fonts.ready;await Promise.all([...camera.querySelectorAll('img')].map(img=>img.decode()));await new Promise(yes=>requestAnimationFrame(()=>requestAnimationFrame(yes)));
 return {kind:shot.kind,text:camera.textContent,times:videos.map(({video})=>video.currentTime),tilts,wall,word,brand:brandState,laptop:laptopState};
};
</script>
</html>

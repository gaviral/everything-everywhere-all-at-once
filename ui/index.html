<!doctype html>
<html lang="en" class="shell2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The shell is the page, so its paper is on from the first paint (the class above; src/shell/flag.ts drops it for ?shell=1).
         The window's bar matches that paper in either theme (--space in src/styles.css); Safari also tints an iPhone's status bar with it. -->
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <!-- Installable to the Dock and a phone's home screen. With credentials, so a sign-in in front of the core
         (the hosted link) lets the manifest through instead of redirecting it. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="E2A2O" />
    <title>E2A2O — Think out loud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
